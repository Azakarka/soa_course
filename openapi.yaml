openapi: 3.1.3
info:
  title: REST Gatewaty - OpenAPI 3.0
  description: |-
    This is REST Gateway specification.
  termsOfService: http://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: https://petstore3.swagger.io/api/v3
tags:
  - name: auth
    description: About authorization
  - name: profile
    description: About profile management
paths:
  /auth/register:
    put:
      tags:
        - auth
      summary: Register new user
      description: Register new user with username, password and email address
      requestBody:
        description: Register new user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMessage'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409':
          description: User already exists

  /auth/login:
    put:
      tags:
        - auth
      summary: Login existing user
      description: Login existing user with username and password
      requestBody:
        description: Login message
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMessage'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User doesn't exist
        '403':
          description: Wrong password

  /profile:
    get:
      tags:
        - profile
      summary: Get profile information
      description: Get current user's profile information
      responses:
        '200':
          description: Returns user profile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Bad or absent token
      security:
        - user_auth:
            - write:profile
            - read:profile

    put:
      tags:
        - profile
      summary: Update profile information
      description: Update current user's profile information
      requestBody:
        description: New profile information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
        required: true
      responses:
        '200':
          description: Returns user new profile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Incorrect data
        '401':
          description: Bad or absent token
      security:
        - user_auth:
            - write:profile
            - read:profile

components:
  schemas:
    RegisterMessage:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
          example: cool_user1
        password:
          type: string
          example: pas!wr5d
        email:
          type: string

    LoginMessage:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    UserProfile:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        birth_date:
          type: string
          format: date

  securitySchemes:
    user_auth:
      type: apiKey
      name: jwt-token
      in: cookie
