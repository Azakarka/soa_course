syntax = "proto3";

package content_service;

message WallPostContent {
  string title = 1;
  string description = 2;
  optional bool is_private = 3;
  repeated string tags = 4;
}

message WallPostWithMeta {
  WallPostContent content = 1;
  string creator_id = 2;
  string post_id = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

message LikePost {
  string post_id = 1;
  string user_id = 2;
  int64 created_at = 3;
}

message Comment {
  string comment_id = 1;
  string post_id = 2;
  string user_id = 3;
  string text = 4;
  int64 created_at = 5;
}


message CreatePostRequest {
  WallPostContent post = 1;
  string creator_id = 2;
}

message CreatePostResponse {
  WallPostWithMeta post = 1;
}

message DeletePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message DeletePostResponse {
  string id = 1;
}

message UpdatePostRequest {
  WallPostContent post = 1;
  string post_id = 2;
  string user_id = 3;
}

message UpdatePostResponse {
  WallPostWithMeta post = 1;
}

message GetPostRequest {
  string post_id = 1;
  string user_id = 2;
}

message GetPostResponse {
  WallPostWithMeta post = 1;
}

message GetPostsRequest {
  string creator_id = 1;
  string user_id = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetPostsResponse {
  repeated WallPostWithMeta posts = 1;
}
message LikePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message LikePostResponse {
  LikePost like = 1;
}

message CommentPostRequest {
  string post_id = 1;
  string user_id = 2;
  string text = 3;
}

message CommentPostResponse {
  Comment comment = 1;
}

message GetCommentsRequest {
  string post_id = 1;
  string user_id = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
}

service ContentService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc GetPosts(GetPostsRequest) returns (GetPostsResponse);
  rpc LikePost(LikePostRequest) returns (LikePostResponse);
  rpc CommentPost(CommentPostRequest) returns (CommentPostResponse);
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
}
