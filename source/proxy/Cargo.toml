[package]
name = "proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
# main framework:
actix-web = "4"

# json
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
futures = "0.3"

# http requests
reqwest = { version = "0.12.12", features = ["json", "cookies"] }

# logging
log = "*"
env_logger = "0.11.6"

# utils
uuid = {version = "0.8.2", features = ["serde", "v4"]}
chrono = {version = "*", features = ["serde"]}
jsonwebtoken = "9.3.1"

# open api
schemars = { package = "apistos-schemars", version = "0.8" }
apistos = "0.4"
